spring:
  # 自动加载项目根目录的 .env（存在才加载），无需手动导出环境变量
  # 说明：.env 以 properties 语法解析，值中请避免反斜杠等转义字符
  # 查找顺序：工作目录（backend/ 或 backend/tb-server/）向上逐级查找项目根目录
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]
  application:
    name: tb-server
  mvc:
    async:
      # SSE 长连接不受 Tomcat 默认 30s 异步超时约束（工作流执行 + 人工确认等待可能持续数分钟）。
      # 负值 = 不超时；主机制是代码里的 new SseEmitter(0L)，此处作为兜底。
      request-timeout: -1ms
  servlet:
    multipart:
      # 单文件上限（知识库文档 / 作业文件共用）
      max-file-size: 50MB
      # 整包上限：作业文件夹一次可提交最多 50 份作业，按单文件 50MB 预留到 1024MB
      max-request-size: 1024MB
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/tb
    # 数据库账号密码：通过环境变量注入，缺失时回退为默认值（真实凭据禁止硬编码）
    username: postgres
    password:
    driver-class-name: org.postgresql.Driver
  ai:
    openai:
      api-key: sk-ca3e404a98e44cdaad87429d4e4b7879
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-flash
          temperature: 0.7
        retry:
          max-attempts: 5
          backoff:
            initial-interval: 2s
            max-interval: 30s
            multiplier: 2
      # 文本向量化模型（知识库 RAG 使用）：OpenAI 兼容接口
      embedding:
        base-url: ${OPENAI_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
        api-key: ${OPENAI_EMBEDDING_API_KEY:sk-b33590d5dc864abfaa16e7080c80a97f}
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-v3}
          dimensions: 1024
    vectorstore:
      pgvector:
        index-type: hnsw
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: true
    # MCP 客户端（stdio）：驱动 docx-mcp 完成「模板→HTML→改写→docx」复刻
    mcp:
      client:
        enabled: true
        name: tb-mcp-client
        version: 1.0.0
        # 同步客户端：便于后端确定性地程序化调用工具
        type: SYNC
        # docx 解析/生成较慢，放宽超时
        request-timeout: 300s
        # 暴露 MCP 工具为 Spring AI ToolCallback，供 DocxMcpGateway 按名调用
        toolcallback:
          enabled: true
        stdio:
          # 用户给定的 mcpServers 配置：docx-mcp（uv run --directory ... mcp run main.py）
          servers-configuration: classpath:mcp-servers-config.json

mybatis:
  configuration:
    # 下划线转驼峰（原生 MyBatis 默认关闭，需显式开启）
    map-underscore-to-camel-case: true

server:
  port: 8086
  servlet:
    context-path: /api

logging:
  level:
    org.example.backend: debug

tb:
  # 测试模块2（文档解析验证）：作业文件文本读取
  test2:
    # 单文件提取文本的字符上限（超出截断，避免响应体过大）
    max-text-chars: 20000
  # 文档模板生成（模板复刻）
  doctemplate:
    # 生成文档临时目录（docx-mcp 进程需能读写该路径）
    temp-dir: ${TB_DOCTEMPLATE_TEMP_DIR:${java.io.tmpdir}/tb-doctemplate}
    # 单次生成份数上限（LLM 规划结果超出时截断）
    max-doc-count: 5
    # 提示词中正文段落清单上限（超出会截断并记 WARN；静默截断会导致漏改）
    max-text-chars: 4000000
    # 提示词中表格/嵌套表格段落清单上限（超出会截断并记 WARN）
    max-digest-chars: 6000000
    # 自检未通过时「补规则 → 重落盘」的最大轮次
    max-fix-rounds: 2
    # 严格自检：旧主题关键词仍有残留 / 新主题关键词缺失时标记为「部分成功」
    strict-self-check: true
  security:
    permit-all-urls:
      - /system/auth/login
      - /test2/read-pptx
      # 作业文件文本读取（测试接口，免登录便于联调）
      - /test2/file-text
      - /doc-template/**
      # 自定义工作流：/run、/resume 为 SSE 流，需免登录（画布定义经请求体提交）
      - /workflow/**
      # 作业批改：文件夹批量上传，便于未登录态联调
      - /homework/**
      # 模拟会议：学生点入会链接免登录参会（会议内身份用 hostToken / attendeeToken；
      # 实时媒体与聊天走 LiveKit 自己的端口 7880/7881，不经过本服务）
      - /meeting/**
      # PPT 讲稿生成：前端 /index/ppt 目前不依赖登录态（无状态接口，不碰数据库）
      - /ppt/**
  # 讲课模块：模拟会议（本期）
  lecture:
    meeting:
      # 学生入会链接基地址（如 http://192.168.1.5:5173）；留空时自动探测本机局域网 IPv4 并拼接前端端口
      public-base-url: ${TB_MEETING_PUBLIC_BASE_URL:}
      # 探测局域网 IP 时拼接的前端端口（Vite 开发服务器默认 5173）
      frontend-port: ${TB_MEETING_FRONTEND_PORT:5173}
      # 入会与详情接口返回的历史消息条数上限
      history-limit: ${TB_MEETING_HISTORY_LIMIT:50}
      # 参会昵称最大长度
      nickname-max-length: ${TB_MEETING_NICKNAME_MAX_LENGTH:20}
      # 单条消息长度上限（与前端 DataChannel 正文口径一致）
      message-max-length: ${TB_MEETING_MESSAGE_MAX_LENGTH:500}
      # 实时通道：LiveKit（媒体走音视频轨、聊天走 DataChannel，后端只签发令牌与删房间）
      # 留空表示未配置：会议仍可创建、可查历史，但入会会被明确拒绝（错误码 1_007_000_010）
      livekit-url: ${LIVEKIT_URL:}
      # 推导信令地址时使用的端口（livekit-url 留空时按 ws://{局域网IP}:{该端口} 拼接）
      livekit-port: ${LIVEKIT_PORT:7880}
      # 必须与 D:\ctf\livekit\.env 里的 LIVEKIT_API_KEY / LIVEKIT_API_SECRET 一致
      livekit-api-key: ${LIVEKIT_API_KEY:}
      livekit-api-secret: ${LIVEKIT_API_SECRET:}
      # 访问令牌有效期（小时）
      livekit-token-ttl-hours: ${LIVEKIT_TOKEN_TTL_HOURS:6}
    # PPT 讲稿生成（前端 /index/ppt 的两个 AI 按钮 → POST /ppt/speech/optimize）
    ppt:
      # 时长 → 字数的语速常数（字/秒）：4.0 ≈ 240 字/分钟
      chars-per-second: ${TB_PPT_CHARS_PER_SECOND:4.0}
      # 每次模型调用的页数：模型输出有 token 上限，整篇一次问会被截断成无效 JSON
      batch-size: ${TB_PPT_BATCH_SIZE:8}
      # 单次请求页数安全上限（超出直接报错，避免误把上百页灌进来）
      max-pages: ${TB_PPT_MAX_PAGES:200}
      # 单页讲稿字数硬上限（模型偶尔写飞，超出即截断）
      max-remark-chars: ${TB_PPT_MAX_REMARK_CHARS:1500}
      # 单页正文/备注送进 prompt 的字符上限
      max-page-input-chars: ${TB_PPT_MAX_PAGE_INPUT_CHARS:1200}
  # 知识库文档解析：阿里云文档智能（文档解析大模型版）
  # AK/SK 为必填项，一律通过环境变量注入（项目根目录 .env，模板见 .env.example），缺失时启动即失败
  docmind:
    endpoint: ${DOCMIND_ENDPOINT:docmind-api.cn-hangzhou.aliyuncs.com}
    access-key-id: ${DOCMIND_ACCESS_KEY_ID:}
    access-key-secret: ${DOCMIND_ACCESS_KEY_SECRET:}
    # 大模型增强（PPT/图表场景效果更好，耗时与费用上升）
    llm-enhancement: ${DOCMIND_LLM_ENHANCEMENT:true}
    # 增强模式，仅 llm-enhancement=true 时生效，可填 VLM
    enhancement-mode: ${DOCMIND_ENHANCEMENT_MODE:}
    formula-enhancement: ${DOCMIND_FORMULA_ENHANCEMENT:false}
    # 表格输出 HTML 正文（版面块的 llmResult 字段）；接口要求必须同时开启 llm-enhancement，否则提交报 Parameter is invalid
    output-html-table: ${DOCMIND_OUTPUT_HTML_TABLE:true}

    # 结果分页拉取步长（接口上限 3000）
    layout-step-size: 3000
    connect-timeout-millis: 20000
    read-timeout-millis: 300000

# MinIO 对象存储（知识库文件）
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:admin}
  secret-key: ${MINIO_SECRET_KEY:admin123456}
  bucket: ${MINIO_BUCKET:test-bucket}