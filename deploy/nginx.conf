# TrueBuddy 前端容器站点配置（compose 版）
# 与 frontend/nginx.conf 的差异：/api 反代目标是 compose 服务名 backend:8086，
# 而不是宿主机 host.docker.internal:8086。其余口径（SSE 不缓冲、SPA 回退）保持一致。

client_max_body_size 200m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
  text/plain text/css text/xml
  application/javascript application/x-javascript
  application/json application/xml
  application/wasm
  image/svg+xml
  font/woff2;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 运行时解析：nginx 启动期不解析 backend，避免后端未就绪时容器起不来
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend "http://backend:8086";

        proxy_pass $backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # SSE / WebSocket：必须关闭缓冲，否则首字节被 nginx 攒住
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(moc3|wav|png|jpg|jpeg|gif|webp|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # createWebHistory：/index/home 等深链必须回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    server_tokens off;
}
