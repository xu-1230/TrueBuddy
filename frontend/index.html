<!DOCTYPE html>
<html lang="zh-CN" data-theme="harbor" data-appearance="light">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 首帧前确定明暗态，避免「先亮后暗」闪烁；键名与 src/composables/useAppearance.js 保持一致
         data-appearance 驱动本项目的 light-dark()；dark 类驱动 Element Plus 暗色变量包（两者须同步） -->
    <script>
      (function () {
        var mode = 'light'
        try {
          var saved = localStorage.getItem('tb-ui-mode')
          if (saved === 'light' || saved === 'dark') {
            mode = saved
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            mode = 'dark'
          }
        } catch (e) {
          mode = 'light'
        }
        var root = document.documentElement
        root.setAttribute('data-appearance', mode)
        root.classList.toggle('dark', mode === 'dark')
      })()
    </script>

    <title>TrueBuddy</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Live2D Cubism Core：加 defer 从关键路径上摘掉（classic deferred 脚本仍按文档顺序
         先于 module 脚本执行，pixi-live2d-display 导入时依然能读到 window.Live2DCubismCore） -->
    <script src="/live2d/live2dcubismcore.min.js" defer></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
