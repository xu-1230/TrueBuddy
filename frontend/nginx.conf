# TrueBuddy 前端 —— Nginx 站点配置
# 放在 /etc/nginx/conf.d/ 下，被主配置的 http {} 块 include

# 上传体积上限：作业批改 / PPT / 知识库涉及文件上传，按需调整
client_max_body_size 200m;

# WebSocket 升级头：无 Upgrade 头时连接应显式关闭，不能原样透传空值
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# -----------------------------------------------------------------------------
# gzip 压缩（Live2D 模型 json、PPT 转换结果等文本资源体积收益明显）
# -----------------------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
  text/plain text/css text/xml
  application/javascript application/x-javascript
  application/json application/xml
  application/wasm
  image/svg+xml
  font/woff2;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # 后端 API 反代：容器 -> 宿主机 8086
    #
    # 用变量 + resolver 是为了「运行时解析」：nginx 若在启动期解析不到 upstream
    # 域名会直接启动失败。后端没启动时页面仍要能打开，所以这里必须延迟到请求时解析。
    # host.docker.internal 由 docker-compose 的 extra_hosts: host-gateway 注入。
    # -------------------------------------------------------------------------
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend "http://host.docker.internal:8086";

        proxy_pass $backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / SSE 支持（AI 流式输出需要）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 流式响应不能被 nginx 缓冲，否则前端要等后端整体返回才收到首字节
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # -------------------------------------------------------------------------
    # 带 hash 的构建产物：内容不变则长期缓存
    # -------------------------------------------------------------------------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Live2D 模型等 public 资源：体积大且基本不变
    location ~* \.(moc3|wav|png|jpg|jpeg|gif|webp|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # SPA 路由回退：项目用 createWebHistory，/index/home 这类路径必须回落到 index.html
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 本身不缓存，否则发版后用户拿到旧页面
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 隐藏 nginx 版本号
    server_tokens off;
}
